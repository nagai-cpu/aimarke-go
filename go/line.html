<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LINEへ移動しています…</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G40EQQELDY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-G40EQQELDY');
</script>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b1220; color:#fff;
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  .box { text-align:center; padding:2rem; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ffd400; display:inline-block;
         margin:0 3px; animation:b 1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay:.15s } .dot:nth-child(3) { animation-delay:.3s }
  @keyframes b { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  a { color:#ffd400 }
  p { color:#93a1bd; font-size:.9rem; margin-top:1.2rem }
</style>
</head>
<body>
<div class="box">
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <p>LINEへ移動しています…<br>
     切り替わらない場合は <a id="fallback" href="https://line.me/R/ti/p/@441jbkws">こちらをタップ</a></p>
</div>
<script>
  var q = new URLSearchParams(location.search);
  // 出所は ?src= で受ける。?s= は使わないこと——GA4の「サイト内検索」の既定
  // クエリパラメータ(q,s,search,query,keyword)に含まれており、拡張計測が
  // 勝手に view_search_results / search_term として拾ってしまう（2026-08-16に実測）。
  // 旧リンク互換のため s= も読むが、新規リンクは必ず src= を使う。
  var src = q.get('src') || q.get('s') || '(none)';
  var dest = 'https://line.me/R/ti/p/@441jbkws';
  // ?debug=1 のときは転送しない。計測タグが実際に発火しているかを
  // ブラウザで確認するための検証モード（LINEへ飛ぶと開発ツールで追えないため）。
  var DEBUG = q.has('debug');
  function go() {
    if (DEBUG) {
      document.querySelector('.box').innerHTML =
        '<p>検証モード：転送しません<br>source = <b>' + src + '</b><br>' +
        'GA4のリアルタイム→イベントで line_click を確認してください</p>';
      return;
    }
    location.replace(dest);
  }
  var moved = false;
  function go_once(){ if (!moved) { moved = true; go(); } }
  var params = { source: src, event_callback: go_once };
  if (!DEBUG) { params.transport_type = 'beacon'; }
  gtag('event', 'line_click', params);
  setTimeout(go_once, 700);
</script>
<noscript>
  <p><a href="https://line.me/R/ti/p/@441jbkws">LINEを開く</a></p>
</noscript>
</body>
</html>
